<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Flota - TecMM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-[#0a0f1d] text-slate-100 flex overflow-hidden">

    <aside class="w-64 bg-[#0d1326] border-r border-slate-800/60 flex flex-col justify-between hidden md:flex">
        <div>
            <div class="p-6 border-b border-slate-800/60 font-bold text-white uppercase">TecMM TMI</div>
            <nav class="p-3 space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Dashboard
                </a>
                <a href="flota.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium bg-violet-600 text-white">
                    <i data-lucide="car" class="w-4 h-4"></i> Flota de Vehículos
                </a>
                <a href="bitacora.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                    <i data-lucide="clipboard-list" class="w-4 h-4"></i> Bitácora
                </a>
            </nav>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <h1 class="text-2xl font-bold mb-6">Gestión de Flota</h1>
        
        <div class="bg-slate-900/50 border border-slate-800 rounded-2xl p-6">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="text-slate-400 text-xs uppercase border-b border-slate-800">
                        <th class="pb-4">Vehículo</th>
                        <th class="pb-4">Tipo</th>
                        <th class="pb-4">Kilometraje</th>
                        <th class="pb-4">Estado</th>
                    </tr>
                </thead>
                <tbody id="tabla-flota-body">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/clases.js"></script>
    <script>
        lucide.createIcons();

        // Lógica específica para llenar la tabla
        function renderTablaFlota() {
            const tbody = document.getElementById('tabla-flota-body');
            const lista = flota.obtenerTodos(); // Método definido en clases.js

            tbody.innerHTML = lista.map(v => `
                <tr class="border-b border-slate-800/50">
                    <td class="py-4 font-medium">${v.name}</td>
                    <td class="py-4 text-slate-400">${v.type}</td>
                    <td class="py-4">${v.km.toLocaleString()} km</td>
                    <td class="py-4">
                        <span class="px-2 py-1 rounded-lg text-xs ${v.status === 'Disponible' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">
                            ${v.status}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        renderTablaFlota();
    </script>
</body>
</html>
