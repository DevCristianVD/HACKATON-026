<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Vehicular Profesional - Login</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>
</head>
<body class="h-full bg-[#0a0f1d] text-slate-100 font-sans flex flex-col justify-center items-center overflow-hidden">

  <!-- Toast de Notificación -->
  <div id="toast" class="fixed top-4 right-4 z-50 hidden flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border transition-all duration-300 transform translate-y-[-20px] opacity-0">
    <i data-lucide="sparkles" class="w-5 h-5 flex-shrink-0" id="toast-icon"></i>
    <span class="text-sm font-medium" id="toast-text">Notificación</span>
  </div>

  <!-- PANTALLA DE LOGIN -->
  <div class="fixed inset-0 bg-[#070b14] flex flex-col justify-center items-center p-4 overflow-hidden">
    <!-- Decoraciones de Fondo -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-violet-600/15 rounded-full blur-3xl"></div>
    <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-emerald-600/10 rounded-full blur-3xl"></div>

    <div class="w-full max-w-md bg-slate-900/80 border border-slate-800/80 backdrop-blur-md rounded-3xl shadow-2xl overflow-hidden relative z-10 p-8">
      <div class="flex flex-col items-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-violet-600 to-indigo-650 rounded-2xl flex items-center justify-center shadow-lg shadow-violet-500/20 mb-4 ring-4 ring-violet-950/40">
          <i data-lucide="car" class="text-white w-8 h-8"></i>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight uppercase">Control Vehicular</h1>
        <p class="text-xs text-slate-400 mt-1 uppercase tracking-widest font-semibold">Plataforma Corporativa TSJ</p>
      </div>

      <form id="login-form" class="space-y-6">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Correo Corporativo</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <i data-lucide="user" class="w-5 h-5"></i>
            </span>
            <input 
              type="email" 
              id="login-email"
              value="jvargasarciniega@gmail.com"
              placeholder="usuario@correo.com" 
              class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800/80 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition-all text-sm"
              required
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Contraseña</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-500">
              <i data-lucide="lock" class="w-5 h-5"></i>
            </span>
            <input 
              type="password" 
              id="login-password"
              value="••••••••"
              placeholder="••••••••" 
              class="w-full pl-10 pr-4 py-3 bg-slate-950 border border-slate-800/80 rounded-xl text-white placeholder-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:border-violet-500 transition-all text-sm"
              required
            />
          </div>
        </div>

        <button 
          type="submit" 
          class="w-full py-3 bg-gradient-to-r from-violet-600 to-indigo-650 hover:from-violet-500 hover:to-indigo-600 text-white rounded-xl font-medium shadow-lg shadow-violet-700/20 transition-all duration-150 transform active:scale-[0.98] flex items-center justify-center gap-2"
        >
          <span>Ingresar al Sistema</span>
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-800/60 text-center">
        <span class="text-xs text-slate-500">Acceso de demostración activo. Pulse "Ingresar".</span>
      </div>
    </div>
    <p class="text-[10px] text-slate-600 mt-6 uppercase tracking-wider">© 2026 Tribunal Superior de Justicia</p>
  </div>

  <script>
    // === TOAST NOTIFICATION ===
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');
      const toastIcon = document.getElementById('toast-icon');

      toastText.innerText = message;
      
      toast.className = `fixed top-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border transition-all duration-300 transform translate-y-0 opacity-100`;
      
      if (type === 'success') {
        toast.classList.add('bg-emerald-950', 'text-emerald-200', 'border-emerald-800/40');
        toastIcon.setAttribute('data-lucide', 'check-circle-2');
      } else if (type === 'error') {
        toast.classList.add('bg-rose-950', 'text-rose-200', 'border-rose-800/40');
        toastIcon.setAttribute('data-lucide', 'alert-triangle');
      } else {
        toast.classList.add('bg-slate-900', 'text-violet-200', 'border-violet-800/40');
        toastIcon.setAttribute('data-lucide', 'sparkles');
      }

      toast.classList.remove('hidden');
      lucide.createIcons();

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-[-20px]');
        setTimeout(() => {
          toast.classList.add('hidden');
        }, 300);
      }, 3500);
    }

    // === GESTIÓN DE LOGIN ===
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      if (!email) {
        showToast('Ingrese un correo corporativo válido', 'error');
        return;
      }
      
      // Guardar email en localStorage
      localStorage.setItem('userEmail', email);
      showToast(`¡Bienvenido de nuevo, ${email}!`, 'success');
      
      // Redirigir al dashboard
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    });

    // Inicializar iconos
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
