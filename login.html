<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Login - TecMM Mobility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-[#070b14] flex flex-col justify-center items-center p-4">
    <div class="w-full max-w-md bg-slate-900/80 border border-slate-800/80 rounded-3xl shadow-2xl p-8">
        <div class="flex flex-col items-center mb-8">
            <div class="w-16 h-16 bg-gradient-to-br from-violet-600 to-indigo-650 rounded-2xl flex items-center justify-center mb-4">
                <i data-lucide="car" class="text-white w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-black text-white uppercase text-center">TecMM Mobility<br>Intelligence</h1>
            <p class="text-xs text-slate-400 mt-1 uppercase">Campus El Grullo</p>
        </div>

        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Correo Institucional</label>
                <input type="email" id="login-email" required placeholder="admin@tecmm.edu.mx" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Contraseña</label>
                <input type="password" required placeholder="••••••••" class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl text-white">
            </div>
            <button type="submit" class="w-full py-3 bg-violet-600 text-white rounded-xl font-bold hover:bg-violet-500 transition-all">Ingresar</button>
        </form>
    </div>

    <script>
        lucide.createIcons();
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Acceso directo para la demo
            localStorage.setItem('tecmm_auth', 'true');
            localStorage.setItem('tecmm_user', document.getElementById('login-email').value);
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
