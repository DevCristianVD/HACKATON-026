<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Bitácora - TecMM TMI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="h-full bg-[#0a0f1d] text-slate-100 flex overflow-hidden">

    <aside class="w-64 bg-[#0d1326] border-r border-slate-800/60 flex flex-col justify-between hidden md:flex">
        <div class="p-6 font-bold text-white uppercase">TecMM TMI</div>
        <nav class="p-3 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Dashboard
            </a>
            <a href="flota.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                <i data-lucide="car" class="w-4 h-4"></i> Flota de Vehículos
            </a>
            <a href="bitacora.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium bg-violet-600 text-white">
                <i data-lucide="clipboard-list" class="w-4 h-4"></i> Bitácora
            </a>
        </nav>
        <div class="p-4 border-t border-slate-850">
            <button onclick="cerrarSesion()" class="w-full flex items-center gap-3 px-4 py-3 text-sm text-slate-400 hover:text-rose-400">
                <i data-lucide="log-out" class="w-4 h-4"></i> Cerrar Sesión
            </button>
        </div>
    </aside>

    <main class="flex-1 p-10 overflow-y-auto">
        <h1 class="text-2xl font-bold mb-6">Bitácora de Comisiones</h1>
        
        <div class="bg-slate-900/50 border border-slate-800 rounded-2xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="bg-slate-950/40">
                    <tr class="text-slate-400 text-xs uppercase">
                        <th class="px-6 py-4">Fecha</th>
                        <th class="px-6 py-4">Unidad</th>
                        <th class="px-6 py-4">Destino</th>
                        <th class="px-6 py-4">Estado</th>
                        <th class="px-6 py-4">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-bitacora-body" class="text-sm">
                    </tbody>
            </table>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/clases.js"></script>
    <script>
        lucide.createIcons();

        function renderTablaBitacoras() {
            const tbody = document.getElementById('tabla-bitacora-body');
            const logs = bitacoras.obtenerTodos(); // Asegúrate de tener este método en clases.js

            tbody.innerHTML = logs.map(l => `
                <tr class="border-b border-slate-800/50">
                    <td class="px-6 py-4">${l.fecha}</td>
                    <td class="px-6 py-4 font-semibold">${l.vehiculoName}</td>
                    <td class="px-6 py-4 text-slate-400">${l.destino}</td>
                    <td class="px-6 py-4">
                        <span class="px-2 py-1 rounded-full text-[10px] ${l.estado === 'Pendiente' ? 'bg-amber-500/10 text-amber-400' : 'bg-emerald-500/10 text-emerald-400'}">
                            ${l.estado}
                        </span>
                    </td>
                    <td class="px-6 py-4">
                        ${l.estado === 'Pendiente' ? `<button onclick="finalizar('${l.id}')" class="text-violet-400 font-bold">Cerrar</button>` : '-'}
                    </td>
                </tr>
            `).join('');
        }

        function finalizar(id) {
            bitacoras.marcarCompletado(id);
            renderTablaBitacoras();
        }

        renderTablaBitacoras();
    </script>
</body>
</html>
