<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Acceso | TecMM Mobility</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-[#0a0f1d] flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-slate-900 p-8 rounded-3xl border border-slate-800 shadow-2xl">
        <h1 class="text-white text-2xl font-black mb-6 text-center">TecMM Mobility</h1>
        
        <form id="login-form" class="space-y-4">
            <input type="email" id="email" required placeholder="Correo institucional" 
                class="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-white outline-none focus:border-violet-500">
            
            <button type="submit" 
                class="w-full py-3 bg-violet-600 hover:bg-violet-500 text-white font-bold rounded-xl transition-all">
                Ingresar al Sistema
            </button>
        </form>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Guardamos que el usuario ya inició sesión
            localStorage.setItem('tecmm_auth', 'true');
            // Redirigimos al dashboard
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
