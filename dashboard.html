<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | TecMM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-[#0a0f1d] text-white">

    <script>
        if (localStorage.getItem('tecmm_auth') !== 'true') {
            window.location.href = 'index.html';
        }
    </script>

    <nav class="p-6 border-b border-slate-800 flex justify-between items-center">
        <h1 class="font-bold text-xl">Sistema de Control Vehicular</h1>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-red-400">Cerrar Sesión</button>
    </nav>

    <main class="p-8">
        <h2 class="text-2xl font-bold">Bienvenido, Operador</h2>
        <p class="text-slate-400 mt-2">Esta es tu pantalla de inicio segura.</p>
    </main>

    <script>
        function logout() {
            localStorage.removeItem('tecmm_auth');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
